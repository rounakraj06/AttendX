{% load static %}
<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>Edit Profile</title>

<style>
    

body{
background:#f4f7fb;
font-family:Arial;
}

.container{
width:100%;
/* margin:40px auto; */
max-width: 500px;
background:#fff;
padding:30px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,.1);
}

input,textarea{
width:100%;
padding:10px;
margin:10px 0;
border:1px solid #ccc;
border-radius:5px;
}

button{
padding:10px 20px;
background:#2563eb;
color:white;
border:none;
border-radius:5px;
cursor:pointer;
}

a{
text-decoration:none;
}

/* ===========================
   MOBILE RESPONSIVE
=========================== */

@media (max-width:768px){

body{
    margin:0;
    padding:0;
}

.container{
    width:100%;
    max-width:100%;
    margin:0;
    padding:20px;
    border-radius:10px;
    box-shadow: none;
}

h2{
    text-align:center;
    /* font-size:24px; */
    margin-bottom:20px;
}

input,
textarea{
    width:100%;
    font-size:16px;
    padding:12px;
}

textarea{
    min-height:100px;
    resize:vertical;
}

button{
    width:100%;
    padding:14px;
    font-size:16px;
    /* margin-top:10px; */
}

a{
    display:block;
    text-align:center;
    margin-top:20px;
    /* font-size:16px; */
}

}

</style>

</head>

<body>

<div class="container">

<h2>Edit Profile</h2>

<form method="POST" enctype="multipart/form-data">

{% csrf_token %}

<label>Profile Photo</label>

<input type="file" name="profile_photo">

<label>University Roll Number</label>

<input
type="text"
name="university_roll_number"
value="{{ student.university_roll_number }}">

<label>Registration Number</label>

<input
type="text"
name="registration_number"
value="{{ student.registration_number }}">

<label>Mobile</label>

<input
type="text"
name="mobile"
value="{{ student.mobile }}">

<label>Email</label>

<input
type="email"
name="email"
value="{{ student.email }}">

<label>Address</label>

<textarea
name="address">{{ student.address }}</textarea>

<button type="submit">

Save Changes

</button>

</form>

<br>

<a href="{% url 'profile' %}">

← Back to Profile

</a>

</div>

</body>

</html>
