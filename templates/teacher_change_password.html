<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Change Password</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#f4f7fb;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:30px;
}

.container{
width:100%;
max-width:520px;
background:#fff;
padding:35px;
border-radius:15px;
box-shadow:0 10px 25px rgba(0,0,0,.08);
}

h2{
text-align:center;
margin-bottom:25px;
color:#2563eb;
font-size:28px;
}

input{
width:100%;
padding:14px;
margin:12px 0;
border:1px solid #d1d5db;
border-radius:10px;
font-size:15px;
outline:none;
transition:.3s;
}

input:focus{
border-color:#2563eb;
box-shadow:0 0 0 3px rgba(37,99,235,.15);
}

button{
width:100%;
padding:14px;
margin-top:10px;
background:#2563eb;
color:#fff;
border:none;
border-radius:10px;
font-size:16px;
font-weight:600;
cursor:pointer;
transition:.3s;
}

button:hover{
background:#1d4ed8;
}

.message{
padding:12px;
margin-bottom:18px;
border-radius:10px;
text-align:center;
font-weight:600;
}

.success{
background:#dcfce7;
color:#166534;
}

.error{
background:#fee2e2;
color:#b91c1c;
}

.back{
display:block;
text-align:center;
margin-top:20px;
text-decoration:none;
color:#2563eb;
font-weight:600;
}

.back:hover{
text-decoration:underline;
}

/* Mobile */

@media(max-width:768px){

body{
padding:12px;
align-items:flex-start;
}

.container{
max-width:100%;
padding:22px;
border-radius:12px;
}

h2{
font-size:24px;
}

input,
button{
font-size:15px;
padding:13px;
}

}



</style>

</head>

<body>

<div class="container">

<h2>🔑 Change Password</h2>

{% if messages %}
    {% for message in messages %}
        <div class="message {% if message.tags == 'success' %}success{% else %}error{% endif %}">
            {{ message }}
        </div>
    {% endfor %}
{% endif %}

<form method="POST">

{% csrf_token %}

<input
type="password"
name="current_password"
placeholder="Current Password"
required>

<input
type="password"
name="new_password"
placeholder="New Password"
required>

<input
type="password"
name="confirm_password"
placeholder="Confirm New Password"
required>

<button type="submit">
Change Password
</button>

</form>

<a href="{% url 'teacher_dashboard' %}" class="back">
← Back to Dashboard
</a>

</div>

</body>

</html>
